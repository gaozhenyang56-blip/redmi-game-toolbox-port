<script>

const store={page:'home',category:'chem',lab:'indicator',logs:[],records:readJSON('novaRecords',[]),chem:{ph:7,indicator:false,volume:60,acid:0,base:0,precip:false,effervescence:0},dissolve:{temp:25,stir:1,material:'salt',progress:0,running:false},circuit:{voltage:6,resistance:10,hasResistor:true,bulbs:1,closed:false},motion:{mass:2,force:8,mu:.1,playing:false,t:0,x:0,v:0,series:[]},optics:{f:20,u:60}};
let currentRaf=0,lastFrame=0,toastTimer=0,resizeWatcher=null;
function readJSON(key,defaultVal){try{return JSON.parse(localStorage.getItem(key))||defaultVal}catch{return defaultVal}}
function persist(){try{localStorage.setItem('novaRecords',JSON.stringify(store.records))}catch{}}
const $=(sel,root=document)=>root.querySelector(sel);const $$=(sel,root=document)=>[...root.querySelectorAll(sel)];const f=(n,dec=1)=>Number(n).toFixed(dec);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(txt){const el=$('#toast');el.textContent=txt;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2250)}
function log(txt){store.logs.unshift(txt);store.logs=store.logs.slice(0,6);const box=$('#logs');if(box)box.innerHTML=store.logs.map(t=>`<div>${esc(t)}</div>`).join('')}
function openPage(page){store.page=page;draw()};function enterLab(id){store.lab=id;store.page='lab';store.logs=[];draw()};function resetLab(){let id=store.lab;if(id==='indicator')store.chem={ph:7,indicator:false,volume:60,acid:0,base:0,precip:false,effervescence:0};if(id==='dissolve')store.dissolve={temp:25,stir:1,material:'salt',progress:0,running:false};if(id==='circuit')store.circuit={voltage:6,resistance:10,hasResistor:true,bulbs:1,closed:false};if(id==='motion')store.motion={mass:2,force:8,mu:.1,playing:false,t:0,x:0,v:0,series:[]};if(id==='optics')store.optics={f:20,u:60};store.logs=[];draw();notify('实验已重置')}
function resultText(){switch(store.lab){case'indicator':return `pH≈${f(store.chem.ph)}，${chemState()}，${store.chem.indicator?'已加入指示剂':'未加入指示剂'}`;case'dissolve':return `${store.dissolve.material==='salt'?'食盐':'蔗糖'}颗粒，${f(store.dissolve.temp,0)}°C，溶解 ${f(store.dissolve.progress,0)}%`;case'circuit':{let c=circuitValues();return `电压 ${f(store.circuit.voltage)}V，电流 ${f(c.current,2)}A，${store.circuit.closed?'开关闭合':'开关断开'}`};case'motion':return `运行 ${f(store.motion.t,1)}s，位移 ${f(store.motion.x,2)}m，速度 ${f(store.motion.v,2)}m/s`;case'optics':{let v=opticsValues();return `焦距 ${store.optics.f}cm，物距 ${store.optics.u}cm，${v.desc}`}}}
function saveRecord(){store.records.unshift({id:Date.now(),name:labs[store.lab].title,subject:labs[store.lab].subject,desc:resultText(),date:new Date().toLocaleString('zh-CN',{hour12:false})});store.records=store.records.slice(0,60);persist();notify('实验记录已保存')}
function header(){return `<header class="topbar"><div class="brand"><div class="logo"><svg fill="none" viewBox="0 0 32 32"><path d="M12 5v9L5 25c-1 2 1 3 3 3h16c2 0 4-1 3-3l-7-11V5" stroke="#083a38" stroke-width="2.4" stroke-linejoin="round"/><path d="M8 22h16" stroke="#083a38" stroke-width="2.4"/><path d="M11 5h10" stroke="#083a38" stroke-width="2.4" stroke-linecap="round"/></svg></div><div><div class="brandstrong">星图实验室</div><div class="brandcaption">NOVA SCIENCE LAB</div></div></div><div class="avatar">✦</div></header>`}
function nav(){return `<nav class="bottomnav" aria-label="底部导航"><button class="navitem ${store.page==='home'?'active':''}" data-page="home"><span class="ico">◈</span><span>探索</span></button><button class="navitem ${store.page==='lab'?'active':''}" data-page="lab"><span class="ico">⚗</span><span>预设实验</span></button><button class="navitem ${store.page==='free'?'active':''}" data-page="free"><span class="ico">✧</span><span>自由实验</span></button><button class="navitem ${store.page==='records'?'active':''}" data-page="records"><span class="ico">▤</span><span>记录</span></button><button class="navitem ${store.page==='settings'?'active':''}" data-page="settings"><span class="ico">⚙</span><span>设置</span></button></nav>`}
function home(){const cards=Object.entries(labs).filter(([id,l])=>l.subject===store.category).map(([id,l])=>`<button class="lab-card" data-lab="${id}" style="--glow:${l.glow}"><div class="lab-card-top"><div class="tile-icon">${l.icon}</div><div class="tag">${l.tag}</div></div><h3>${l.title}</h3><p>${l.desc}</p><div class="lab-card-bottom"><span>${l.subtitle}</span><span>开始 →</span></div></button>`).join('');return `${header()}<div class="content"><section class="hero"><small>● 你的掌上虚拟实验台</small><h1>让每个好奇心<br>都有实验室。</h1><p>探索化学变化，发现物理规律。自由调整参数，即时观察模拟现象。</p><div class="hero-art"><div class="neck"></div><div class="flask"></div><i class="dot d1"></i><i class="dot d2"></i><i class="dot d3"></i></div></section><button class="fo-quick" data-page="free"><span><strong>✧ 进入自由实验室</strong><small>空白工作台 · 任意添加器材 · 动态模拟</small></span><span style="font-size:23px">›</span></button><div class="metrics"><div class="metric"><b>05</b><span>互动实验</span></div><div class="metric"><b>02</b><span>学科领域</span></div><div class="metric"><b>${String(store.records.length).padStart(2,'0')}</b><span>实验记录</span></div></div><div class="section-head"><h2>选择实验</h2><small>自由探索 · 无需登录</small></div><div class="tabs"><button class="tab ${store.category==='chem'?'active':''}" data-category="chem">🧪 化学</button><button class="tab ${store.category==='physics'?'active':''}" data-category="physics">⚡ 物理</button></div><section class="cards">${cards}</section><p class="fineprint">本应用仅用于课堂科学原理模拟，不提供现实实验操作指导。部分模型采用理想化近似。</p></div>`}
function labTitle(){const l=labs[store.lab];return `<div class="lab-top"><button class="back" id="backhome" aria-label="返回首页">‹</button><div class="lab-heading"><small>${l.subject==='chem'?'化学实验':'物理实验'} / ${l.subtitle}</small><h1>${l.title}</h1></div><button class="textbtn" id="reset">↻ 重置</button></div>`}
function shellLab(stage,control,readouts,info){return `${header()}<div class="content">${labTitle()}<div class="workspace-grid"><section class="stage-panel"><div class="stage-head"><b>实时模拟区</b><span class="live">LIVE SIMULATION</span></div>${stage}<div class="stage-bottom">${readouts.map(a=>`<div class="readout"><small>${a[0]}</small><strong id="${a[2]}">${a[1]}</strong></div>`).join('')}</div></section><aside class="controls">${control}<div class="buttonrow"><button class="secondary" id="resetSide">重置</button><button class="primary" id="save">＋ 保存记录</button></div>${info?`<div class="note-card"><b>原理卡片</b><br>${info}</div>`:''}</aside></div><div class="footer-message">✦ 虚拟仿真 · 请勿将模型结果直接当作现实实验数据</div></div>`}
function chemState(){const p=store.chem.ph;return p<6.4?'酸性':p>7.6?'碱性':'接近中性'}
function chemColor(){if(!store.chem.indicator)return '#77bfff';let p=store.chem.ph;return p<4?'#f76c99':p<6.4?'#df85c3':p<7.6?'#967de2':p<9?'#5bbcd9':'#6ed1a0'}
function chemPage(){const c=store.chem;const bubbles=Array.from({length:11},(_,i)=>`<span class="bubble" style="--x:${5+(i*37)%90}%;--w:${5+(i*7)%9}px;--t:${1.2+(i%5)*.3}s;animation-delay:-${i*.23}s;${c.effervescence===0?'display:none':''}"></span>`).join('');const stage=`<div class="stage stage-grid" id="chemDrop"><span class="stage-note">点击试剂或拖入烧杯</span><div class="stage-glow"></div><div class="beaker"><div class="liquid" id="chemLiquid" style="--liquid:${chemColor()};height:${Math.min(75,30+c.volume*.22)}%"></div>${c.precip?'<div class="precip"></div>':''}<div class="graduations"></div>${bubbles}</div></div>`;
const reagent=[['indicator','紫甘蓝指示剂','观察颜色','#a87be9'],['acid','酸性样本','虚拟试剂','#f484a5'],['base','碱性样本','虚拟试剂','#75d5ba'],['water','纯水','稀释样本','#83c3ff'],['bubbles','气泡现象','演示模型','#ffd195'],['precip','沉淀现象','演示模型','#d8cef8']].map(r=>`<button class="reagent" data-reagent="${r[0]}"><span class="vial" style="--vialcolor:${r[3]}"></span><span><b>${r[1]}</b><small>${r[2]}</small></span></button>`).join('');let ctrl=`<h3>试剂架</h3><p class="hint">在试剂架中选择虚拟材料，加入烧杯进行模拟。支持拖放操作。</p><div class="shelf">${reagent}</div><div class="smalltitle">实验现象</div><div class="logbox" id="logs"><div>烧杯中装有模拟纯水，等待操作</div></div>`;
return shellLab(stage,ctrl,[['估算 pH',f(c.ph),'readPh'],['当前性质',chemState(),'readNature'],['虚拟体积',`${c.volume} mL`,'readVol']], '模拟 pH 值与指示剂颜色的关系：偏酸呈粉红，接近中性呈紫色，偏碱呈绿色。使用简化规则模型，并非精密化学计算。')}
function addReagent(type){let c=store.chem;let msg='';if(type==='indicator'){c.indicator=true;msg='加入指示剂，观察当前溶液颜色'}else if(type==='acid'){c.acid+=1;c.ph=Math.max(2.3,7+(c.base-c.acid)*1.8);c.volume=Math.min(180,c.volume+12);msg='加入酸性虚拟样本，pH 发生变化'}else if(type==='base'){c.base+=1;c.ph=Math.min(11.7,7+(c.base-c.acid)*1.8);c.volume=Math.min(180,c.volume+12);msg='加入碱性虚拟样本，pH 发生变化'}else if(type==='water'){c.ph=7+(c.ph-7)*.62;c.volume=Math.min(180,c.volume+16);msg='加水后，模拟溶液趋向中性'}else if(type==='bubbles'){c.effervescence=1;msg='启动虚拟气泡动画（演示模型）'}else if(type==='precip'){c.precip=true;msg='模拟生成沉淀（不对应具体化学反应）'}if(store.lab!=='indicator')return;log(msg);$('.beaker .liquid').style.setProperty('--liquid',chemColor());$('.beaker .liquid').style.height=Math.min(75,30+c.volume*.22)+'%';$('#readPh').textContent=f(c.ph);$('#readNature').textContent=chemState();$('#readVol').textContent=c.volume+' mL';if(type==='precip'&&!$('.beaker .precip'))$('.beaker').insertAdjacentHTML('beforeend','<div class="precip"></div>');if(type==='bubbles')$$('.bubble').forEach(x=>x.style.display='');notify(msg)}

 $('#foRangeOhms')?.addEventListener('input',e=>{const v=Number(e.target.value);const x=freeObject(freeData().selected);if(x){x.ohms=v;freePersist();freeUpdateStats();const label=$('#foRangeOhms')?.previousElementSibling?.querySelector('b');if(label)label.textContent=v+' Ω';const current=$('#foInspector .fo-info .fo-numrow strong');if(current)current.textContent=Math.abs(freeState.solution?.currents?.[x.id]||0).toFixed(3)+' A';}});
 $('#foSwitch')?.addEventListener('click',()=>freeChangeProp('closed',!o.closed));

function freeUpdateWires(){const svg=$('#foWires');const board=$('#foBoard');if(!svg||!board||freeState.mode!=='electric')return;
 const rect=board.getBoundingClientRect();let code='';for(const [i,w] of freeData().wires.entries()){
  const a=board.querySelector(`.fo-terminal[data-id="${w.a}"][data-port="${w.ap}"]`),b=board.querySelector(`.fo-terminal[data-id="${w.b}"][data-port="${w.bp}"]`);if(!a||!b)continue;
  const ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect(), x1=ra.left+ra.width/2-rect.left, y1=ra.top+ra.height/2-rect.top,x2=rb.left+rb.width/2-rect.left,y2=rb.top+rb.height/2-rect.top;
  let mx=x1+(x2-x1)/2;const path=`M${x1.toFixed(1)} ${y1.toFixed(1)} H${mx.toFixed(1)} V${y2.toFixed(1)} H${x2.toFixed(1)}`;
  code+=`<path d="${path}" class="fo-wire-hit" data-wire="${i}"/><path d="${path}" class="fo-wire-path"/>`;
 }svg.setAttribute('viewBox',`0 0 ${rect.width} ${rect.height}`);svg.innerHTML=code;svg.querySelectorAll('[data-wire]').forEach(p=>p.addEventListener('click',()=>freeRemoveWire(Number(p.dataset.wire))))
}
function freeSolve(){const d=freeState.data.electric;let obj=d.objects;if(freeState.mode!=='electric')return null;
 const batteries=obj.filter(x=>x.kind==='battery');if(batteries.length===0)return {message:'添加一个直流电源，接入电路开始计算',currents:{},volts:{}};
 if(batteries.length>1)return {message:'当前模型仅支持单电源电路，请先移除多余电源',currents:{},volts:{}};
 const keys=obj.flatMap(o=>[`${o.id}:0`,`${o.id}:1`]);const parent=new Map(keys.map(k=>[k,k]));function find(x){if(!parent.has(x))return null;while(parent.get(x)!==x){parent.set(x,parent.get(parent.get(x)));x=parent.get(x)}return x}function union(a,b){const x=find(a),y=find(b);if(x!=null&&y!=null&&x!==y)parent.set(x,y)}
 d.wires.forEach(w=>union(`${w.a}:${w.ap}`,`${w.b}:${w.bp}`));obj.filter(x=>x.kind==='switch'&&x.closed).forEach(x=>union(`${x.id}:0`,`${x.id}:1`));
 const battery=batteries[0],neg=find(`${battery.id}:0`),pos=find(`${battery.id}:1`);if(pos===neg)return {message:'检测到电源两极直接短接，请检查导线和开关',currents:{},volts:{}};
 const edges=[];obj.filter(x=>['resistor','lamp','meter'].includes(x.kind)).forEach(o=>{const a=find(`${o.id}:0`),b=find(`${o.id}:1`);edges.push({id:o.id,a,b,r:o.kind==='meter'?1e6:Number(o.ohms)||10})});
 const adj=new Map();function link(a,b){if(!adj.has(a))adj.set(a,[]);adj.get(a).push(b)}edges.forEach(e=>{link(e.a,e.b);link(e.b,e.a)});
 const visited=new Set([pos]),queue=[pos];for(let j=0;j<queue.length;j++)for(const to of adj.get(queue[j])||[])if(!visited.has(to)){visited.add(to);queue.push(to)}
 if(!visited.has(neg))return {message:'电路尚未构成闭合回路（检查导线和开关）',currents:{},volts:{}};
 const unknown=[...visited].filter(n=>n!==pos&&n!==neg),ix=new Map(unknown.map((k,i)=>[k,i])),n=unknown.length,mat=Array.from({length:n},()=>Array(n+1).fill(0)),V=Number(battery.voltage)||6;
 for(const e of edges){if(!visited.has(e.a)||!visited.has(e.b)||e.a===e.b)continue;const g=1/e.r;for(const [a,b] of [[e.a,e.b],[e.b,e.a]])if(ix.has(a)){const i=ix.get(a);mat[i][i]+=g;if(ix.has(b))mat[i][ix.get(b)]-=g;else if(b===pos)mat[i][n]+=g*V}}
 for(let j=0;j<n;j++){let p=j;for(let i=j+1;i<n;i++)if(Math.abs(mat[i][j])>Math.abs(mat[p][j]))p=i;if(Math.abs(mat[p][j])<1e-13)return {message:'电路存在浮空节点，无法稳定求解',currents:{},volts:{}};[mat[j],mat[p]]=[mat[p],mat[j]];let k=mat[j][j];for(let c=j;c<=n;c++)mat[j][c]/=k;for(let r=0;r<n;r++)if(r!==j){k=mat[r][j];for(let c=j;c<=n;c++)mat[r][c]-=k*mat[j][c]}}
 const voltsN=new Map([[pos,V],[neg,0]]);unknown.forEach((k,i)=>voltsN.set(k,mat[i][n]));let currents={},volts={};let batteryI=0;
 for(let e of edges){const delta=(voltsN.get(e.a)||0)-(voltsN.get(e.b)||0);currents[e.id]=e.a===e.b?0:delta/e.r;volts[e.id]=delta;if(e.a===pos)batteryI+=(voltsN.get(e.a)-voltsN.get(e.b))/e.r;if(e.b===pos)batteryI+=(voltsN.get(e.b)-voltsN.get(e.a))/e.r}
 return {message:`电路闭合 · 电源 ${V} V · 输出 ${Math.abs(batteryI).toFixed(3)} A`,currents,volts};
}
function freeUpdateStats(){const el=$('#foStatus');if(!el)return;let d=freeData();if(freeState.mode==='chem'){
 const total=d.objects.filter(o=>validContainer.has(o.kind)).reduce((a,o)=>a+(o.volume||0),0);el.innerHTML=`<span>器材 <b>${d.objects.length}</b></span><span>虚拟液量 <b>${Math.round(total)} mL</b></span><span>状态 <b>可编辑</b></span>`;
 }else{
 freeState.solution=freeSolve();const s=freeState.solution;el.innerHTML=`<span>器材 <b>${d.objects.length}</b></span><span>导线 <b>${d.wires.length}</b></span><span class="fo-solver">${esc(s.message)}</span>`;
 d.objects.forEach(o=>{if(o.kind==='lamp'){const lamp=$('#foIcon'+o.id);if(lamp)lamp.classList.toggle('fo-lit',Math.abs(s.currents?.[o.id]||0)>0.002)}});
 }
}

  let start=null,moved=false,undoSaved=false;const id=Number(el.dataset.grab);el.addEventListener('pointerdown',e=>{if(e.target.closest('.fo-terminal'))return;const obj=freeObject(id);if(!obj)return;start={x:e.clientX,y:e.clientY,ox:obj.x,oy:obj.y};moved=false;undoSaved=false;el.setPointerCapture?.(e.pointerId)});
  el.addEventListener('pointermove',e=>{if(!start)return;const board=$('#foBoard');if(!board)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)<4&&!moved)return;if(!undoSaved){freeSnapshot();undoSaved=true}moved=true;const o=freeObject(id),rect=board.getBoundingClientRect();o.x=Math.max(11,Math.min(89,start.ox+dx/rect.width*100));o.y=Math.max(17,Math.min(83,start.oy+dy/rect.height*100));const node=el.closest('.fo-object');node.style.left=o.x+'%';node.style.top=o.y+'%';freeUpdateWires()});
  el.addEventListener('pointerup',()=>{if(!start)return;start=null;freePersist();freeChoose(id);if(moved)freeUpdateWires()});
  el.addEventListener('pointercancel',()=>{start=null;freePersist()});
 });
 if(foResizeObserver){foResizeObserver.disconnect();foResizeObserver=null}if('ResizeObserver' in window){foResizeObserver=new ResizeObserver(()=>freeUpdateWires());foResizeObserver.observe($('#foBoard'));}
}
