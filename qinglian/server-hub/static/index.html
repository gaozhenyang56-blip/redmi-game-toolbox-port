<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鲸屿 · 服务聚合面板</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body><div class="glow"></div><main><header><div class="brand"><span class="logo">◈</span><div><h1>鲸屿 <small>SERVER HUB</small></h1><p>所有服务，一个入口。</p></div></div><div class="top"><span id="live">独立监测 · 每 10 秒刷新</span><button id="logout" hidden>退出</button></div></header><section id="login" class="login"><span class="eyebrow">WELCOME ABOARD</span><h2>进入你的服务控制台</h2><p>使用当前 OpenList 账号登录，查看服务器状态和服务入口。</p><form><label>账号<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button type="submit" class="primary">登录面板 →</button><p id="login-error" role="alert"></p></form></section><div id="dashboard" hidden><div class="intro"><div><span class="eyebrow">SYSTEM OVERVIEW</span><h2>服务器运行概览</h2><p id="host"></p></div><span id="sample" class="badge"></span></div><div id="metrics" class="metrics"></div><div id="warning" role="status" hidden></div><nav><button data-tab="projects" class="selected">服务总览</button><button data-tab="ports">监听端口</button><button data-tab="containers">容器</button><button data-tab="units">系统服务</button></nav><div class="section-title"><h3 id="section-label">项目与后台</h3><input id="search" placeholder="搜索服务、进程或端口…" aria-label="搜索服务"></div><section id="content"></section><footer>只读状态监测 · 端口监听不代表公网防火墙已放行 · QQ 在线状态不代表群消息发送权限</footer></div></main></body></html>
