<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>千恋＊万花 · 游戏预览</title><style>html,body{margin:0;width:100%;height:100%;background:#101015;overflow:hidden;font-family:sans-serif}main{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}iframe{width:min(100vw,177.7778vh);height:min(100vh,56.25vw);border:0;background:#000}nav{position:fixed;z-index:10;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;gap:5px;opacity:.45}nav:hover,nav:focus-within{opacity:1}button{border:1px solid #ffffff30;background:#16131bdc;color:#fff;border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer}#state{position:fixed;bottom:7px;left:10px;color:#c8bcc9;font-size:11px;pointer-events:none}nav{max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:flex-end}#load-panel{position:fixed;left:10px;bottom:30px;width:min(460px,calc(100vw - 20px));padding:10px 12px;box-sizing:border-box;background:#17151de8;color:#eee;border:1px solid #ffffff30;border-radius:8px;font-size:12px;pointer-events:none}#load-meter{display:block;width:100%;height:7px;margin:6px 0}#load-detail{color:#c8bcc9;font-size:11px}#load-panel.error{border-color:#e59393}#preload-actions button{pointer-events:auto;font-size:11px;padding:3px 8px;margin:4px 6px 4px 0}#hide-progress{pointer-events:auto;float:right;padding:2px 6px;margin-left:8px}dialog{width:min(480px,calc(100vw - 30px));box-sizing:border-box;background:#211d29;color:#eee;border:1px solid #6c596d;border-radius:14px;padding:24px;font-size:14px;line-height:1.7}dialog::backdrop{background:#0009}dialog h2{font-size:20px;margin-top:0}dialog input{display:block;max-width:100%;margin:12px 0}dialog p{color:#cbbfce}dialog button{margin:8px 5px 0 0}#session-banner{position:fixed;bottom:7px;right:10px;max-width:65vw;color:#f7dc9d;background:#211c26dd;font-size:11px;padding:3px 8px;border-radius:5px;pointer-events:none}</style><script defer src="/preload-cache.js?v=preload-cache-1"></script><script defer src="/engine/vendor/jszip.min.js"></script><script defer src="/gallery-save.js?v=gallery-save-1"></script><script defer src="/engine-cache.js?v=engine-cache-1"></script><script defer src="/play.js"></script></head><body><dialog id="session-dialog"><h2>选择本次启动方式</h2><p>普通启动使用原有存档；也可导入已解锁CG的存档进行本次鉴赏。</p><button id="normal-session">普通启动</button><hr><label>鉴赏存档 ZIP（最大32 MiB）<input id="gallery-save" type="file" accept=".zip"></label><p>鉴赏启动不写回正常存档，不提供存档导出或云同步。游戏运行中的临时写入会在关闭后丢弃。</p><p>内置存档来自原游戏压缩包，仅用于本次鉴赏。</p><button id="builtin-gallery-session" disabled>使用内置 CG 存档（只读）</button><br><button id="gallery-session">导入并以只读模式启动</button><p id="session-error" role="status"></p></dialog><main><iframe id="game" title="千恋万花游戏画面" allow="autoplay; fullscreen" allowfullscreen></iframe></main><nav><label style="font-size:12px;color:white">渲染 <select id="renderer" aria-label="渲染方式"><option value="opengl">硬件加速</option><option value="software">兼容模式</option></select></label><label style="font-size:12px;color:white"><input id="startup-log" type="checkbox" checked>画面日志</label><label style="font-size:12px;color:white">预缓存 <select id="preload-budget" aria-label="启动预缓存大小"><option value="0">直接进入</option><option value="16">16 MiB</option><option value="32">32 MiB</option><option value="64">64 MiB</option><option value="128">128 MiB</option><option value="256" selected>256 MiB</option></select></label><span id="fps" title="按主画布实际绘制统计" style="color:white;font-size:12px">绘制 FPS：等待画面</span><button id="show-progress">加载进度</button><button id="full">全屏</button><button id="menu">菜单</button><button id="export">导出存档</button><button id="back">返回</button></nav><aside id="load-panel"><button id="hide-progress" aria-label="收起加载进度">收起</button><span id="load-label" role="status" aria-live="polite">正在连接游戏资源…</span><progress id="load-meter" max="100" aria-label="当前资源读取进度"></progress><div id="preload-actions"><button id="enter-now">立即进入</button><button id="retry-preload" hidden>重试预缓存</button></div><div id="engine-cache-status" style="font-size:11px;color:#c8bcc9">正在检查引擎缓存…</div><div id="load-detail">按需加载，百分比表示当前资源读取进度。</div></aside><span id="session-banner" hidden>只读鉴赏 · 本次保存不会保留</span><span id="state" role="status">预览版 · 正在进行兼容性验证</span></body></html>
