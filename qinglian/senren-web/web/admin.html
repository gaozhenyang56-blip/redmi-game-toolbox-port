<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>游戏文件管理</title><link rel="stylesheet" href="/admin.css"><script defer src="/admin.js"></script></head>
<body><main><header><div><p class="eyebrow">千恋＊万花 · 测试环境</p><h1>文件管理</h1></div><nav><a href="/">游戏入口</a><button id="refresh">刷新</button></nav></header>
<p class="hint">修改在此端口生效。原版资源保留，覆盖和删除前保留历史版本；游戏运行期间请勿更换资源，修改后重新打开游戏。</p>
<section aria-labelledby="upload-title"><h2 id="upload-title">上传文件或补丁</h2><p>支持 XP3、游戏脚本、图片、音频和字体。单文件最多 4 GiB，不支持 EXE 安装器及 DLL。补丁兼容性需进入游戏验证。</p><div class="upload"><label>目标子目录（留空上传到游戏根目录）<input id="folder" placeholder="例如 patch，或留空"></label><label>选择文件<input id="files" type="file" multiple></label><button id="upload">开始上传</button></div><progress id="progress" value="0" max="100" hidden></progress><p id="space"></p></section>
<p id="status" role="status" aria-live="polite">正在读取文件…</p>
<section><div class="section-head"><h2>游戏文件</h2><label>搜索路径<input id="search" type="search" placeholder="patch.xp3 / 文件名"></label></div><div class="scroll"><table><thead><tr><th>文件路径</th><th>大小</th><th>来源</th><th>操作</th></tr></thead><tbody id="listing"></tbody></table></div><p id="empty" hidden>没有匹配的文件。</p></section>
<section><h2>已移除文件</h2><p>可恢复原版资源；自己上传的文件可从下方历史版本恢复。</p><div id="deleted"></div></section>
<section><h2>修改历史</h2><p>恢复历史版本会替换同名文件。历史内容占用磁盘空间。</p><div class="scroll"><table><thead><tr><th>文件路径</th><th>备份时间</th><th>大小</th><th>操作</th></tr></thead><tbody id="history"></tbody></table></div></section>
<dialog id="editor"><form method="dialog" id="editor-form"><div class="section-head"><h2 id="editor-title">编辑文件</h2><button value="cancel" id="close-editor">关闭</button></div><label>文件编码<select id="encoding"><option value="auto">自动识别</option><option value="utf-8">UTF-8</option><option value="utf-8-sig">UTF-8 BOM</option><option value="utf-16">UTF-16 BOM</option><option value="gb18030">GB18030</option></select></label><button type="button" id="reload-text">按此编码重新读取</button><label class="text-label">文件内容<textarea id="text" spellcheck="false"></textarea></label><p id="edit-status" role="status"></p><button type="button" id="save">保存修改</button></form></dialog>
</main></body></html>
