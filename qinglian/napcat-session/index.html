<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QQ 扫码登录</title>
<style>body{font:16px system-ui;background:#f4f6fb;color:#202736;margin:0;padding:28px 16px}main{max-width:440px;margin:5vh auto;background:white;border-radius:24px;padding:28px;box-shadow:0 14px 60px #24345b12}h1{font-size:26px;margin:0 0 12px}p{line-height:1.7;color:#626c7d}input,button,a.button{box-sizing:border-box;width:100%;padding:13px;border-radius:12px;margin:6px 0;font:inherit}input{border:1px solid #d7dce5}button,a.button{background:#2563eb;color:white;border:0;cursor:pointer;text-align:center;text-decoration:none;display:block}button.secondary{background:#edf2fc;color:#254a96}#qr{display:block;width:250px;height:250px;margin:16px auto}.hide{display:none!important}label{display:block;margin:12px 0}label input{width:auto}#status{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#657085}</style>
<main><h1>QQ 扫码登录</h1><p>登录面板后，用手机 QQ 扫描另一台设备屏幕上的二维码并确认。</p><form id="login"><input id="username" placeholder="AstrBot 面板用户名" autocomplete="username" required><input id="password" type="password" placeholder="AstrBot 面板密码" autocomplete="current-password" required><button>进入登录页面</button><small>使用现有 AstrBot 面板账号；保持登录，修改密码或退出后需重新验证。</small></form><section id="panel" class="hide"><p id="status">正在连接…</p><img id="qr" class="hide" alt="QQ 登录二维码"><a id="open" class="button hide">打开 QQ 扫一扫</a><a id="save" class="button hide" href="/api/qr.png" download="QQ登录二维码.png">保存二维码图片</a><details><summary>查看二维码解码内容</summary><input id="decoded" readonly aria-label="二维码解码内容"><button type="button" class="secondary" id="copy">复制解码内容</button><small>这是扫码识别内容，直接当作网页打开可能进入下载页。</small></details><button id="refresh" class="secondary">刷新二维码</button><button id="logout" class="secondary">退出面板登录</button><label><input type="checkbox" id="auto">二维码准备好后自动尝试打开 QQ 扫一扫</label><small>QQ 登录二维码通常不支持相册识别或长按登录，请在另一台手机或电脑上显示二维码，再用 QQ 扫描。打开扫一扫不代表已授权；确认后回到此页查看状态。</small></section><p id="error" role="status"></p></main>
<script>
const $=s=>document.getElementById(s);let last='',jumped=false,polling=false,loginBusy=false,pollController=null;
async function api(path,options={}){const r=await fetch(path,{credentials:'same-origin',...options});if(!r.ok){let detail=await r.text();try{const j=JSON.parse(detail);detail=j.message||detail}catch(_){}if(r.status===401&&path!=='/api/login'){$('login').classList.remove('hide');$('panel').classList.add('hide')}throw Error(r.status===401?(path==='/api/login'?'账号或密码错误，请使用当前 AstrBot 面板账号登录':'请先登录'):r.status===503?'服务正在启动，请稍后重试':detail)}return r.json()}
function jump(){if($('open').dataset.url)location.href=$('open').dataset.url}
async function poll(){if(polling||loginBusy)return;polling=true;const controller=new AbortController();pollController=controller;try{const d=await api('/api/status',{signal:controller.signal});if(loginBusy||controller.signal.aborted)return;$('login').classList.add('hide');$('panel').classList.remove('hide');$('error').textContent='';if(d.isLogin){$('status').textContent='QQ 已登录并在线。AstrBot 将自动连接此账号。';$('qr').classList.add('hide');$('open').classList.add('hide');$('save').classList.add('hide');$('decoded').value='';return}
$('status').textContent=d.loginError||({qrcode_scanned:'二维码已扫描，请在手机 QQ 确认。',initializing:'已确认，正在初始化，请稍候。',reconnecting:'正在恢复 QQ 连接…'}[d.loginPhase])||(d.isOffline?'QQ 当前离线，请检查登录状态。':'请使用手机 QQ 扫描二维码。');
if(d.qrcodeurl){const u=new URL(d.qrcodeurl);if(u.protocol!=='https:'||!(u.hostname==='qq.com'||u.hostname.endsWith('.qq.com')))throw Error('登录链接格式异常');if(last!==d.qrcodeurl){last=d.qrcodeurl;$('qr').src='/api/qr.png?t='+Date.now();$('save').href='/api/qr.png?t='+Date.now();$('save').classList.remove('hide');$('decoded').value=d.qrcodeurl;$('qr').classList.remove('hide');const link='mqqapi://qrcode/scan_qrcode?version=1&src_type=app';$('open').href=link;$('open').dataset.url=link;$('open').classList.remove('hide');if(!jumped&&$('auto').checked&&/Android|iPhone|iPad/i.test(navigator.userAgent)){jumped=true;setTimeout(jump,600)}}}
}catch(e){if(e.name!=='AbortError'&&!String(e.message).includes('请先登录'))$('error').textContent=e.message}finally{if(pollController===controller){polling=false;pollController=null}}}
$('copy').onclick=async()=>{try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText($('decoded').value)}else{$('decoded').select();if(!document.execCommand('copy'))throw Error('请长按解码内容复制')}$('error').textContent='已复制；请勿公开此临时登录内容。'}catch(e){$('error').textContent=e.message}};
$('login').onsubmit=async e=>{e.preventDefault();if(loginBusy)return;loginBusy=true;if(pollController)pollController.abort();pollController=null;polling=false;let ok=false;try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});$('password').value='';$('error').textContent='';$('login').classList.add('hide');$('panel').classList.remove('hide');ok=true}catch(e){$('error').textContent=e.message}finally{loginBusy=false}if(ok)await poll()};
$('logout').onclick=async()=>{try{await api('/api/logout',{method:'POST'});$('panel').classList.add('hide');$('login').classList.remove('hide');$('error').textContent='已退出面板登录。'}catch(e){$('error').textContent=e.message}};
$('refresh').onclick=async()=>{try{$('refresh').disabled=true;await api('/api/refresh',{method:'POST'});last='';await poll()}catch(e){$('error').textContent=e.message}finally{$('refresh').disabled=false}};
setInterval(()=>{if(!document.hidden&&!$('panel').classList.contains('hide'))poll()},5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});api('/api/session').then(()=>{$('login').classList.add('hide');$('panel').classList.remove('hide');return poll()}).catch(e=>{if(!String(e.message).includes('请先登录'))$('error').textContent=e.message});
</script></html>
