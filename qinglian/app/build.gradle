plugins { id 'com.android.application' }
def releaseKeys = new Properties()
def signingPath = providers.gradleProperty('qinglianSigningProperties').orNull ?: System.getenv('QINGLIAN_SIGNING_PROPERTIES') ?: 'signing/release.properties'
def signingFile = rootProject.file(signingPath)
if (signingFile.exists()) signingFile.withInputStream { releaseKeys.load(it) }
def hasReleaseKeys = !releaseKeys.isEmpty()
android {
 namespace 'com.gzy.qinglian'
 buildFeatures { buildConfig true }
 compileSdk 35
 buildToolsVersion '35.0.0'
 defaultConfig { applicationId 'com.gzy.qinglian'; minSdk 26; targetSdk 35; versionCode 15; versionName '1.1.6-preview'; ndk { abiFilters 'arm64-v8a' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 testOptions { unitTests.includeAndroidResources = true }
 packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/*.so'] } }
 signingConfigs { if (hasReleaseKeys) { production { storeFile rootProject.file(releaseKeys.getProperty('storeFile', 'signing/release.jks')); storePassword (System.getenv('QINGLIAN_STORE_PASSWORD') ?: releaseKeys.storePassword); keyAlias releaseKeys.keyAlias; keyPassword (System.getenv('QINGLIAN_KEY_PASSWORD') ?: releaseKeys.keyPassword) } } }
 buildTypes { release { minifyEnabled false; if (hasReleaseKeys) signingConfig signingConfigs.production } }
}
dependencies {
 implementation 'com.google.android.material:material:1.14.0'
 implementation 'androidx.appcompat:appcompat:1.7.1'
 implementation files('libs/libv2ray.aar')
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
 testImplementation 'org.robolectric:robolectric:4.16.1'
}

tasks.withType(Test).configureEach { maxHeapSize="2g"; jvmArgs "--add-opens=java.base/java.net=ALL-UNNAMED"; systemProperty "robolectric.dependency.repo.url", "https://repo.maven.apache.org/maven2"; ["http.proxyHost","http.proxyPort","https.proxyHost","https.proxyPort","javax.net.ssl.trustStore","javax.net.ssl.trustStorePassword"].each { k -> if(System.getProperty(k)) systemProperty k, System.getProperty(k) }; testLogging { events "failed", "passed"; exceptionFormat "full" } }
