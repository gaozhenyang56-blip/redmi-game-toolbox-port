name: Open source client and panel checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare pinned native dependencies
        run: python3 qinglian/scripts/prepare_dependencies.py
      - name: Build and verify Android (unconfigured public build)
        working-directory: qinglian
        run: ./gradlew assembleDebug testReleaseUnitTest lintRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-development-apk
          path: qinglian/app/build/outputs/apk/debug/*.apk
  panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Go
        run: |
          curl -fsSL https://go.dev/dl/go1.23.12.linux-amd64.tar.gz -o "$RUNNER_TEMP/go.tar.gz"
          printf '%s  %s\n' "$(cat qinglian/selfhost/go-sdk.sha256)" "$RUNNER_TEMP/go.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/go.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
      - name: Validate bootstrap and build actual pinned panel
        run: |
          python3 -m unittest discover -s qinglian/ubuntu -p test_server_config.py -v
          python3 -m unittest discover -s qinglian/selfhost -p test_installer.py -v
          python3 qinglian/selfhost/build_panel.py --output dist/panel
      - name: Fresh systemd installation and both account workers (loopback only)
        run: sudo env GITHUB_ACTIONS=true QINGLIAN_CI_FRESH_INSTALL=1 python3 qinglian/selfhost/test_fresh_server.py --bundle dist/panel
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panel-amd64-installation-bundle
          path: dist/panel/
