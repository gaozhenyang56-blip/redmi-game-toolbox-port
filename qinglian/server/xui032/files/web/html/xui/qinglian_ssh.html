<!DOCTYPE html><html lang="zh-CN">{{template "head" .}}
<link rel="stylesheet" href="{{.base_path}}assets/qinglian-ssh/xterm.css">
<style>.ssh-page{margin:24px;max-width:1500px}.ssh-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}.ssh-top input{max-width:240px}.ssh-host{color:#666}#terminal{height:65vh;min-height:360px;background:#15171b;border-radius:8px;padding:14px}.ssh-status{margin:12px 0}.ssh-top button{min-width:88px}@media(max-width:600px){.ssh-page{margin:12px}.ssh-top input{max-width:100%}#terminal{height:60vh;padding:8px}}</style>
<body><a-layout id="app" v-cloak>{{template "commonSider" .}}<a-layout><a-layout-content class="ssh-page">
<h1>服务器 SSH 终端</h1><p><a href="{{.base_path}}xui/qinglian">返回轻连管理</a></p>
<a-card><p class="ssh-host">仅连接当前服务器的本机 SSH 服务。命令以所登录 SSH 用户的权限执行；关闭终端会断开会话。</p>
<div class="ssh-top"><a-input id="ssh-user" v-model="username" autocomplete="username" placeholder="SSH 用户名" :disabled="connected||connecting"></a-input><a-input-password id="ssh-password" v-model="password" autocomplete="off" placeholder="SSH 密码（不保存）" :disabled="connected||connecting" @pressEnter="connect"></a-input-password><a-button type="primary" @click="connect" :loading="connecting" :disabled="connected">连接</a-button><a-button @click="disconnect" :disabled="!connected&&!connecting">断开</a-button><a-button @click="clearTerminal">清屏</a-button></div>
<a-alert :type="statusType" :message="status" class="ssh-status" show-icon></a-alert><div id="terminal" aria-label="服务器 SSH 终端"></div>
<p style="margin-top:14px;color:#777">密码只通过 HTTPS/WSS 用于当前会话，不保存到浏览器或服务器配置；终端输出不写入面板日志。连接最多保留1小时，15分钟没有输入会断开。刷新页面后需要重新连接。</p></a-card>
</a-layout-content></a-layout></a-layout>
{{template "commonJs" .}}
<script src="{{.base_path}}assets/qinglian-ssh/xterm.js"></script><script src="{{.base_path}}assets/qinglian-ssh/addon-fit.js"></script>
<script>
(()=>{'use strict';let term,socket,fit,resizeObserver,generation=0;const app=new Vue({el:'#app',data:{username:'root',password:'',connected:false,connecting:false,status:'请输入 SSH 账号后连接当前服务器。',statusType:'info',siderDrawer},mounted(){term=new Terminal({cursorBlink:true,scrollback:2000,fontFamily:'Cascadia Mono,Consolas,monospace',fontSize:14,theme:{background:'#15171b',foreground:'#e6e9ef'},allowProposedApi:false});fit=new FitAddon.FitAddon();term.loadAddon(fit);term.open(document.getElementById('terminal'));fit.fit();term.onData(data=>{if(socket&&socket.readyState===WebSocket.OPEN&&this.connected)socket.send(JSON.stringify({type:'input',data}));});resizeObserver=new ResizeObserver(()=>{fit.fit();if(socket&&socket.readyState===WebSocket.OPEN&&this.connected)socket.send(JSON.stringify({type:'resize',cols:Math.min(300,Math.max(20,term.cols)),rows:Math.min(100,Math.max(5,term.rows))}));});resizeObserver.observe(document.getElementById('terminal'));window.addEventListener('beforeunload',()=>this.disconnect());},methods:{connect(){if(this.connecting||this.connected)return;if(location.protocol!=='https:'){this.status='请使用 HTTPS 面板入口打开 SSH 终端。';this.statusType='warning';return;}if(!this.username||!this.password){this.status='请输入用户名和密码。';this.statusType='warning';return;}this.connecting=true;this.status='正在连接本机 SSH…';this.statusType='info';const owner=++generation;let secret=this.password;this.password='';const url=new URL('{{.base_path}}xui/qinglian/ssh/ws',location.origin);url.protocol='wss:';const current=new WebSocket(url);socket=current;current.binaryType='arraybuffer';current.onopen=()=>{if(owner!==generation){current.close();secret='';return;}current.send(JSON.stringify({type:'auth',username:this.username,password:secret,cols:Math.min(300,Math.max(20,term.cols)),rows:Math.min(100,Math.max(5,term.rows))}));secret='';};current.onmessage=event=>{if(owner!==generation)return;if(event.data instanceof ArrayBuffer){term.write(new Uint8Array(event.data));return;}let data;try{data=JSON.parse(event.data);}catch(_){return;}if(data.type==='ready'){this.connected=true;this.connecting=false;this.status='SSH 已连接当前服务器';this.statusType='success';term.focus();}else if(data.type==='error'){this.status=data.message||'SSH 连接失败';this.statusType='error';current.close();}};current.onerror=()=>{if(owner===generation){this.status='SSH 连接失败，请检查 HTTPS、面板登录和 SSH 账号。';this.statusType='error';}};current.onclose=()=>{secret='';if(owner!==generation)return;this.connected=false;this.connecting=false;socket=null;if(this.statusType!=='error'){this.status='SSH 已断开';this.statusType='info';}};},disconnect(){generation++;this.password='';if(socket){if(socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:'close'}));socket.close();socket=null;}this.connected=false;this.connecting=false;this.status='SSH 已断开';this.statusType='info';},clearTerminal(){term.clear();}}});})();
</script></body></html>
