<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轻连 · 设备后台</title><style>
:root{color-scheme:light dark;--bg:#f4f7f4;--card:#fff;--fg:#17372b;--muted:#66796f;--line:#dfe8e0;--green:#23664b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}main{max-width:1320px;margin:auto;padding:42px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{margin:0;font-size:32px;letter-spacing:-1px}p{color:var(--muted);line-height:1.7}.badge{background:#d4eddd;color:#205137;border-radius:30px;padding:9px 16px;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:30px 0}.card,.tablebox{background:var(--card);border-radius:26px;padding:26px;border:1px solid var(--line)}label{color:var(--muted);font-size:13px}.number{font-size:42px;font-weight:650;margin-top:10px}.tablebox{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left}th{font-size:12px;color:var(--muted);font-weight:500}td,th{padding:16px 12px;border-bottom:1px solid var(--line)}td strong{display:block}small{color:var(--muted);display:block;margin-top:5px}.online{color:#167342}.offline{color:var(--muted)}button{background:var(--green);color:#fff;border:0;padding:13px 22px;border-radius:24px;cursor:pointer}#error{color:#a53030;min-height:24px}.empty{text-align:center;padding:48px;color:var(--muted)}@media(max-width:650px){main{padding:28px 16px}.stats{grid-template-columns:1fr}.number{font-size:34px}h1{font-size:27px}header{align-items:start}.badge{display:none}}@media(prefers-color-scheme:dark){:root{--bg:#101a15;--card:#18261e;--fg:#e2efe5;--muted:#a6b9ac;--line:#304135;--green:#347352}.online{color:#80d9a7}}
</style><main><header><div><h1>轻连 · 设备后台</h1><p>查看当前连接，以及设备的实时状态。</p></div><span class="badge">PRIVATE CONSOLE</span></header><section class="stats"><article class="card"><label>当前同时在线</label><div class="number" id="online">—</div></article><article class="card"><label>当前在线设备上传</label><div class="number" id="up">—</div></article><article class="card"><label>当前在线设备下载</label><div class="number" id="down">—</div></article></section><header><h2>设备列表</h2><button onclick="refresh()">刷新</button></header><p id="updated">每 3 秒刷新 · 30 秒无心跳后标记离线</p><div id="error" role="status"></div><section class="tablebox"><table><thead><tr><th>设备</th><th>状态</th><th>版本</th><th>来源 IP</th><th>上传 / 下载速度</th><th>本次上传 / 下载</th><th>连接 / 最近活跃</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>暂无设备。请在配置后台后使用轻连连接 VPN。</div></section><p>统计来自本 App 的在线心跳，代表设备数；不代表经过网络验证的自然人数。离线记录保留 7 天，不采集 IMEI、通讯录、文件或浏览记录。</p></main><script>
const $=id=>document.getElementById(id);let busy=false;const size=n=>{let units=['B','KB','MB','GB'],i=0;while(n>=1024&&i<3){n/=1024;i++}return n.toFixed(i?1:0)+' '+units[i]},date=n=>new Date(n*1000).toLocaleString();function cell(row,value){let td=document.createElement('td');td.textContent=value;row.append(td);return td}
async function refresh(){if(busy)return;busy=true;try{let r=await fetch('/admin/api/devices',{cache:'no-store'});if(!r.ok)throw Error('读取失败，请检查登录状态');let j=await r.json(),on=j.devices.filter(d=>d.online);$('online').textContent=j.online+' 台';$('up').textContent=size(on.reduce((a,d)=>a+d.up_rate,0))+'/s';$('down').textContent=size(on.reduce((a,d)=>a+d.down_rate,0))+'/s';$('rows').replaceChildren();for(let d of j.devices){let row=document.createElement('tr'),name=cell(row,d.name||d.model||'Android 设备'),sub=document.createElement('small');sub.textContent=d.brand+' '+d.model+' · '+d.id.slice(0,8);name.append(sub);cell(row,d.online?'● 在线':'○ 离线').className=d.online?'online':'offline';cell(row,'Android '+d.android+' / App '+d.app);cell(row,d.ip);cell(row,(d.online?size(d.up_rate):'0 B')+'/s ↑ / '+(d.online?size(d.down_rate):'0 B')+'/s ↓');cell(row,size(d.up)+' ↑ / '+size(d.down)+' ↓');let t=cell(row,date(d.started)),last=document.createElement('small');last.textContent=date(d.seen);t.append(last);$('rows').append(row)}$('empty').hidden=j.devices.length!==0;$('updated').textContent='上次更新 '+new Date().toLocaleTimeString()+' · 每 3 秒刷新';$('error').textContent=''}catch(e){$('error').textContent='更新失败，当前显示上次数据。'+e.message}finally{busy=false}}
refresh();setInterval(refresh,3000);
</script></html>
