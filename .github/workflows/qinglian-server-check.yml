name: Qinglian server read-only check
on:
  push:
    branches: [codex/qinglian-routing-and-presence]
    paths:
      - '.github/workflows/qinglian-server-check.yml'
      - 'qinglian/server/github/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: qinglian/server/github
      - name: Install SSH client library
        run: python3 -m pip install --disable-pip-version-check paramiko==3.5.1
      - name: Read-only server inspection
        env:
          QINGLIAN_SSH_HOST: ${{ secrets.QINGLIAN_SSH_HOST }}
          QINGLIAN_SSH_PORT: ${{ secrets.QINGLIAN_SSH_PORT }}
          QINGLIAN_SSH_USER: ${{ secrets.QINGLIAN_SSH_USER }}
          QINGLIAN_SSH_PASSWORD: ${{ secrets.QINGLIAN_SSH_PASSWORD }}
          QINGLIAN_SSH_HOST_KEY: ${{ secrets.QINGLIAN_SSH_HOST_KEY }}
        run: python3 qinglian/server/github/inspect_server.py
