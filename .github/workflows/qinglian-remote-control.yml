name: Qinglian phone remote control deployment
on:
  push:
    branches: [codex/qinglian-routing-and-presence]
    paths: ['.github/workflows/qinglian-remote-control.yml', 'qinglian/remote-control/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qinglian-server-maintenance
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            qinglian/remote-control
            qinglian/server/github
      - run: python3 -m unittest discover -s qinglian/remote-control/tests -v
      - run: node --check qinglian/remote-control/static/app.js
      - run: python3 -m pip install --disable-pip-version-check paramiko==3.5.1 cryptography==44.0.3
      - name: Deploy isolated HTTPS phone relay and verify outside
        env:
          QINGLIAN_SSH_HOST: ${{ secrets.QINGLIAN_SSH_HOST }}
          QINGLIAN_SSH_PORT: ${{ secrets.QINGLIAN_SSH_PORT }}
          QINGLIAN_SSH_USER: ${{ secrets.QINGLIAN_SSH_USER }}
          QINGLIAN_SSH_PASSWORD: ${{ secrets.QINGLIAN_SSH_PASSWORD }}
        run: python3 qinglian/remote-control/deploy.py
