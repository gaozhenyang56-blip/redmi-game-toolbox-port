name: Qinglian Windows GUI and native verification
on:
  push:
    branches: [codex/qinglian-routing-and-presence]
    paths: ['qinglian/windows/**', 'qinglian/ubuntu/runtime.py', '.github/workflows/qinglian-windows.yml']
  workflow_dispatch:
    inputs:
      release:
        description: Verify real server paths and publish Windows installer and portable ZIP
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: qinglian
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install fixed GUI and packaging tools
        run: python -m pip install --disable-pip-version-check PySide6==6.8.3 pyinstaller==6.11.1 paramiko==3.5.1
      - name: Prepare isolated bootstrap and pinned native resources
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/fixture-assets" | Out-Null
          Copy-Item qinglian/app/src/test/resources/tls-ca.pem "$env:RUNNER_TEMP/fixture-assets/ca.pem"
          '{"url":"https://203.0.113.1/api/v1/profile","clientToken":"public-ci-fixture-not-real","caAsset":"ca.pem"}' | Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP/fixture-assets/profile.json"
          python qinglian/windows/build.py --assets "$env:RUNNER_TEMP/fixture-assets" --output "$env:RUNNER_TEMP/fixture" --resources-only --fixture
      - name: Platform lifecycle, DPAPI and unchanged shared TLS behavior
        run: |
          python -m unittest discover -s qinglian/windows -p test_client.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python qinglian/windows/test_transport.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python qinglian/windows/test_probe.py
      - name: Actual Windows native five protocols and HY2 high performance
        env:
          QINGLIAN_TEST_LIB: ${{ runner.temp }}/fixture/resources
        run: python qinglian/windows/test_native.py
      - name: Real Qt GUI pages, themes and account consent
        env:
          QINGLIAN_SCREENSHOT: ${{ runner.temp }}/qinglian-windows.png
        run: python qinglian/windows/test_gui.py
      - name: Restore deployed bootstrap and public CA only
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          QINGLIAN_SSH_HOST: ${{ secrets.QINGLIAN_SSH_HOST }}
          QINGLIAN_SSH_PORT: ${{ secrets.QINGLIAN_SSH_PORT }}
          QINGLIAN_SSH_USER: ${{ secrets.QINGLIAN_SSH_USER }}
          QINGLIAN_SSH_PASSWORD: ${{ secrets.QINGLIAN_SSH_PASSWORD }}
        run: |
          python qinglian/ubuntu/prepare_release_assets.py "$env:RUNNER_TEMP/production-assets"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python qinglian/windows/build.py --assets "$env:RUNNER_TEMP/production-assets" --output "$env:RUNNER_TEMP/production" --resources-only
      - name: Real CDN and four metered guest paths (4 MiB, no deployment)
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          QINGLIAN_SSH_HOST: ${{ secrets.QINGLIAN_SSH_HOST }}
          QINGLIAN_SSH_PORT: ${{ secrets.QINGLIAN_SSH_PORT }}
          QINGLIAN_SSH_USER: ${{ secrets.QINGLIAN_SSH_USER }}
          QINGLIAN_SSH_PASSWORD: ${{ secrets.QINGLIAN_SSH_PASSWORD }}
        run: python qinglian/windows/live_smoke.py "$env:RUNNER_TEMP/production/resources"
      - name: Build dedicated installer and portable release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        run: python qinglian/windows/build.py --assets "$env:RUNNER_TEMP/production-assets" --output "$env:RUNNER_TEMP/production"
      - name: Verify packaged windowless GUI, proxy guardian and installation
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          QINGLIAN_TEST_APP: ${{ runner.temp }}/production/dist/Qinglian/Qinglian.exe
          QINGLIAN_CI_WINDOWS: '1'
        run: |
          python -m unittest discover -s qinglian/windows -p test_client.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = "$env:RUNNER_TEMP/production/dist/Qinglian/Qinglian.exe"
          $screenshot = "$env:RUNNER_TEMP/qinglian-windows-packaged.png"
          $p = Start-Process -FilePath $app -ArgumentList @('--smoke-test', $screenshot) -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'Packaged GUI timeout' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $screenshot)) { throw 'Packaged GUI failed' }
          $setup = "$env:RUNNER_TEMP/production/Qinglian-1.0.0-preview1-windows-x64-setup.exe"
          $install = "$env:RUNNER_TEMP/installed-qinglian"
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$install") -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$install/Qinglian.exe")) { throw 'Installer failed' }
          $p = Start-Process -FilePath "$install/unins000.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Test-Path "$install/Qinglian.exe")) { throw 'Uninstall failed' }
      - name: Publish only the verified Windows artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $delivery = "$env:RUNNER_TEMP/production"
          gh release create qinglian-windows-v1.0.0-preview1 -R "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --prerelease --title '轻连 Windows 1.0.0-preview1' --notes-file qinglian/windows/RELEASE_NOTES.md "$delivery/Qinglian-1.0.0-preview1-windows-x64-setup.exe" "$delivery/Qinglian-1.0.0-preview1-windows-x64-portable.zip" "$delivery/SHA256SUMS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qinglian-windows-gui
          path: ${{ runner.temp }}/qinglian-windows*.png
          if-no-files-found: warn
