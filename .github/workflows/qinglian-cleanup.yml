name: Qinglian maintenance leftover inspection and cleanup
on:
  push:
    branches: [codex/qinglian-routing-and-presence]
    paths: ['.github/workflows/qinglian-cleanup.yml']
  workflow_dispatch:
    inputs:
      clean:
        description: Remove only old inactive Qinglian temporary staging
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: qinglian-server-maintenance
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: qinglian/server/github
      - run: python3 -m pip install --disable-pip-version-check paramiko==3.5.1
      - name: Inspect or clean only bounded maintenance leftovers
        env:
          QINGLIAN_SSH_HOST: ${{ secrets.QINGLIAN_SSH_HOST }}
          QINGLIAN_SSH_PORT: ${{ secrets.QINGLIAN_SSH_PORT }}
          QINGLIAN_SSH_USER: ${{ secrets.QINGLIAN_SSH_USER }}
          QINGLIAN_SSH_PASSWORD: ${{ secrets.QINGLIAN_SSH_PASSWORD }}
          QINGLIAN_CLEAN: ${{ github.event_name == 'workflow_dispatch' && inputs.clean && '1' || '0' }}
        run: python3 qinglian/server/github/server_cleanup.py
