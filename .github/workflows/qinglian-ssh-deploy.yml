name: Qinglian panel verification and deployment
on:
  push:
    branches: [codex/qinglian-routing-and-presence]
    paths: ['.github/workflows/qinglian-ssh-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qinglian-server-maintenance
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: qinglian
      - run: python3 -m pip install --disable-pip-version-check paramiko==3.5.1 websocket-client==1.8.0 playwright==1.62.0
      - name: Verify snapshot-only backup restoration
        run: python3 -m unittest discover -s qinglian/server -p test_backup_server.py -v
      - name: Encrypted consistent backup before panel upgrade
        env:
          QINGLIAN_SSH_HOST: ${{ secrets.QINGLIAN_SSH_HOST }}
          QINGLIAN_SSH_PORT: ${{ secrets.QINGLIAN_SSH_PORT }}
          QINGLIAN_SSH_USER: ${{ secrets.QINGLIAN_SSH_USER }}
          QINGLIAN_SSH_PASSWORD: ${{ secrets.QINGLIAN_SSH_PASSWORD }}
        run: python3 qinglian/server/github/backup_server.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qinglian-before-panel-ssh
          path: private-transfer/
          retention-days: 14
          if-no-files-found: error
      - name: Install pinned Go and verify vendored terminal resources
        run: |
          curl -fsSL https://go.dev/dl/go1.23.12.linux-amd64.tar.gz -o "$RUNNER_TEMP/go.tar.gz"
          printf '%s  %s\n' "$(cat qinglian/server/github/go-sdk.sha256)" "$RUNNER_TEMP/go.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/go.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('qinglian/server/xui032/files/web/assets/qinglian-ssh')
          for name,value in json.loads((p/'UPSTREAM.json').read_text()).items():assert hashlib.sha256((p/name).read_bytes()).hexdigest()==value['sha256']
          PY
      - name: Test permissions, origin, concurrency and complete overlay
        env:
          QINGLIAN_SSH_RENDER: ${{ runner.temp }}/ssh-rendered.html
          QINGLIAN_DIAGNOSTIC_RENDER: ${{ runner.temp }}/diagnostic-rendered.html
          QINGLIAN_CLASH_RENDER: ${{ runner.temp }}/clash-rendered.html
          QINGLIAN_CLASH_FIXTURES: ${{ runner.temp }}/clash-fixtures
        run: |
          python3 -m unittest discover -s qinglian/server -p test_export_engine.py -v
          git clone --branch 0.3.2 --depth 1 https://github.com/vaxilu/x-ui.git "$RUNNER_TEMP/x-ui"
          python3 qinglian/server/xui032/apply.py "$RUNNER_TEMP/x-ui"
          cd "$RUNNER_TEMP/x-ui"
          go test -race ./web/controller ./web
          go build -trimpath -o "$RUNNER_TEMP/qinglian-x-ui" .
      - name: Verify real Mihomo configuration loader
        run: |
          curl -fsSL https://github.com/MetaCubeX/mihomo/releases/download/v1.19.16/mihomo-linux-amd64-v1.19.16.gz -o "$RUNNER_TEMP/mihomo.gz"
          printf '%s  %s\n' d06f37a21df275bc36002b98ad35835caf9ac1b1c4cb3fad750fd2b3f94617fe "$RUNNER_TEMP/mihomo.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/mihomo.gz" > "$RUNNER_TEMP/mihomo"
          chmod 755 "$RUNNER_TEMP/mihomo"
          "$RUNNER_TEMP/mihomo" -t -d "$RUNNER_TEMP/mihomo-data" -f "$RUNNER_TEMP/clash-fixtures/clash.yaml"
          "$RUNNER_TEMP/mihomo" -t -d "$RUNNER_TEMP/mihomo-data" -f "$RUNNER_TEMP/clash-fixtures/mihomo.yaml"
      - name: Chromium terminal page, fixture WSS and mobile layout
        env:
          QINGLIAN_CHROME: /usr/bin/google-chrome
        run: |
          python3 qinglian/server/github/test_ssh_ui.py "$RUNNER_TEMP/ssh-rendered.html" "$RUNNER_TEMP/x-ui/web/assets"
          python3 qinglian/server/github/test_diagnostics_ui.py "$RUNNER_TEMP/diagnostic-rendered.html" "$RUNNER_TEMP/x-ui/web/assets"
          python3 qinglian/server/github/test_clash_ui.py "$RUNNER_TEMP/clash-rendered.html" "$RUNNER_TEMP/x-ui/web/assets"
      - name: Deploy binary, preserve nodes and counters, verify real HTTPS SSH PTY
        env:
          QINGLIAN_SSH_HOST: ${{ secrets.QINGLIAN_SSH_HOST }}
          QINGLIAN_SSH_PORT: ${{ secrets.QINGLIAN_SSH_PORT }}
          QINGLIAN_SSH_USER: ${{ secrets.QINGLIAN_SSH_USER }}
          QINGLIAN_SSH_PASSWORD: ${{ secrets.QINGLIAN_SSH_PASSWORD }}
          QINGLIAN_VERIFY_CDN: '1'
          QINGLIAN_SERVER_BINARY: ${{ runner.temp }}/qinglian-x-ui
          QINGLIAN_CLASH_CORE: ${{ runner.temp }}/mihomo
        run: python3 qinglian/server/github/ssh_upgrade.py
