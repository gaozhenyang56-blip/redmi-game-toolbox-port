name: Qinglian account and export workers deployment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qinglian-server-maintenance
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: qinglian/server
      - run: python3 -m pip install --disable-pip-version-check paramiko==3.5.1
      - name: Back up live state before installing isolated workers
        env: &ssh
          QINGLIAN_SSH_HOST: ${{ secrets.QINGLIAN_SSH_HOST }}
          QINGLIAN_SSH_PORT: ${{ secrets.QINGLIAN_SSH_PORT }}
          QINGLIAN_SSH_USER: ${{ secrets.QINGLIAN_SSH_USER }}
          QINGLIAN_SSH_PASSWORD: ${{ secrets.QINGLIAN_SSH_PASSWORD }}
        run: python3 qinglian/server/github/backup_server.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qinglian-before-account-engine-backup
          path: private-transfer/
          retention-days: 14
          if-no-files-found: error
      - name: Deploy account supervisor without replacing original nodes
        env: *ssh
        run: python3 qinglian/server/github/deploy_exports.py
      - name: Prepare pinned native clients for the public account checks
        run: |
          curl -fsSL https://github.com/apernet/hysteria/releases/download/app%2Fv2.13.0/hysteria-linux-amd64 -o "$RUNNER_TEMP/hysteria"
          printf '%s  %s\n' '907ba8c9693edb104b20582681fb7dc15639d5b64a9cbb616a7b539190a86691' "$RUNNER_TEMP/hysteria" | sha256sum -c -
          chmod 700 "$RUNNER_TEMP/hysteria"
          curl -fsSL https://github.com/v2fly/v2ray-core/releases/download/v5.54.2/v2ray-linux-64.zip -o "$RUNNER_TEMP/v2ray.zip"
          printf '%s  %s\n' '595f22e9f56936c8f4c471b3e81a9fe35d356dae9342fd71d1caf8dc99ac8378' "$RUNNER_TEMP/v2ray.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/v2ray.zip" v2ray > "$RUNNER_TEMP/v2ray"
          chmod 700 "$RUNNER_TEMP/v2ray"
      - name: Check public five-protocol account flows and remove test fixtures
        env:
          QINGLIAN_SSH_HOST: ${{ secrets.QINGLIAN_SSH_HOST }}
          QINGLIAN_SSH_PORT: ${{ secrets.QINGLIAN_SSH_PORT }}
          QINGLIAN_SSH_USER: ${{ secrets.QINGLIAN_SSH_USER }}
          QINGLIAN_SSH_PASSWORD: ${{ secrets.QINGLIAN_SSH_PASSWORD }}
          QINGLIAN_HY2_BINARY: ${{ runner.temp }}/hysteria
          QINGLIAN_V2RAY_BINARY: ${{ runner.temp }}/v2ray
        run: python3 qinglian/server/github/account_smoke.py
