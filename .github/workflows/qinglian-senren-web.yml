name: Senren private game preview and isolated test
on:
  push:
    branches: [codex/qinglian-routing-and-presence]
    paths: ['.github/workflows/qinglian-senren-web.yml', 'qinglian/senren-web/**']
  workflow_dispatch:
    inputs:
      prepare_resources:
        description: Download and transfer complete game resources
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: qinglian-server-maintenance
  cancel-in-progress: false
jobs:
  entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            qinglian/senren-web
            qinglian/server/github
      - run: python3 -m pip install --disable-pip-version-check paramiko==3.5.1 cryptography==44.0.3
      - name: File manager regression checks
        run: python3 -m unittest discover -s qinglian/senren-web/tests -v
      - name: Cache and loading progress regression checks
        run: |
          node qinglian/senren-web/tests/test_range_cache.cjs
          node qinglian/senren-web/tests/test_load_progress.cjs
      - name: Publish authenticated preview entry
        env:
          QINGLIAN_SSH_HOST: ${{ secrets.QINGLIAN_SSH_HOST }}
          QINGLIAN_SSH_PORT: ${{ secrets.QINGLIAN_SSH_PORT }}
          QINGLIAN_SSH_USER: ${{ secrets.QINGLIAN_SSH_USER }}
          QINGLIAN_SSH_PASSWORD: ${{ secrets.QINGLIAN_SSH_PASSWORD }}
          SENREN_DEPLOY_MODE: entry
        run: python3 qinglian/senren-web/deploy.py
  resources:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_resources
    needs: entry
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            qinglian/senren-web
            qinglian/server/github
      - run: python3 -m pip install --disable-pip-version-check paramiko==3.5.1 cryptography==44.0.3
      - name: Prepare and transfer base resources
        env:
          QINGLIAN_SSH_HOST: ${{ secrets.QINGLIAN_SSH_HOST }}
          QINGLIAN_SSH_PORT: ${{ secrets.QINGLIAN_SSH_PORT }}
          QINGLIAN_SSH_USER: ${{ secrets.QINGLIAN_SSH_USER }}
          QINGLIAN_SSH_PASSWORD: ${{ secrets.QINGLIAN_SSH_PASSWORD }}
          SENREN_DEPLOY_MODE: resources
        run: python3 qinglian/senren-web/deploy.py
