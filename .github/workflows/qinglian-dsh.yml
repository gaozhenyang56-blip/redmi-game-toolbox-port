name: Qinglian DeepSeek Harness deployment
on:
  push:
    branches: [codex/dsh-deploy-20261115]
    paths: ['.github/workflows/qinglian-dsh.yml', 'qinglian/dsh/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qinglian-server-maintenance
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            qinglian/dsh
            qinglian/server/github
      - run: python3 -m pip install --disable-pip-version-check paramiko==3.5.1
      - name: Inspect DSH prerequisites
        env:
          QINGLIAN_SSH_HOST: ${{ secrets.QINGLIAN_SSH_HOST }}
          QINGLIAN_SSH_PORT: ${{ secrets.QINGLIAN_SSH_PORT }}
          QINGLIAN_SSH_USER: ${{ secrets.QINGLIAN_SSH_USER }}
          QINGLIAN_SSH_PASSWORD: ${{ secrets.QINGLIAN_SSH_PASSWORD }}
        run: python3 qinglian/dsh/inspect.py
