name: Qinglian x-ui HTTPS 521 guarded recovery
on:
  push:
    branches: [codex/qinglian-routing-and-presence]
    paths: ['.github/workflows/qinglian-origin-521-repair.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qinglian-server-maintenance
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: qinglian/server/github
      - run: python3 -m pip install --disable-pip-version-check paramiko==3.5.1
      - name: Guarded HTTPS restart and sanitized diagnostics
        env:
          QINGLIAN_SSH_HOST: ${{ secrets.QINGLIAN_SSH_HOST }}
          QINGLIAN_SSH_PORT: ${{ secrets.QINGLIAN_SSH_PORT }}
          QINGLIAN_SSH_USER: ${{ secrets.QINGLIAN_SSH_USER }}
          QINGLIAN_SSH_PASSWORD: ${{ secrets.QINGLIAN_SSH_PASSWORD }}
        run: python3 qinglian/server/github/recover_origin_521.py
      - name: External Cloudflare HTTPS response check
        run: |
          python3 - <<'PY'
          import json,urllib.error,urllib.request
          result={}
          for path in ('/','/login','/api/v1/quota'):
              req=urllib.request.Request('https://gaozy.tech'+path,headers={'User-Agent':'Qinglian-521-Recheck/1.0'})
              try:
                  with urllib.request.build_opener(urllib.request.ProxyHandler({})).open(req,timeout=12) as response:
                      result[path]={'code':response.status}
              except urllib.error.HTTPError as error:
                  result[path]={'code':error.code}
              except Exception as error:
                  result[path]={'errorType':type(error).__name__}
          print(json.dumps({'publicHttpsCheck':result},sort_keys=True))
          PY
