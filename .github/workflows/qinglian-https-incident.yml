name: Qinglian HTTPS 521 read-only incident diagnostic
on:
  push:
    branches: [codex/qinglian-routing-and-presence]
    paths: ['.github/workflows/qinglian-https-incident.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: qinglian/server/github
      - run: python3 -m pip install --disable-pip-version-check paramiko==3.5.1
      - name: Read-only origin listener and TLS diagnostics
        env:
          QINGLIAN_SSH_HOST: ${{ secrets.QINGLIAN_SSH_HOST }}
          QINGLIAN_SSH_PORT: ${{ secrets.QINGLIAN_SSH_PORT }}
          QINGLIAN_SSH_USER: ${{ secrets.QINGLIAN_SSH_USER }}
          QINGLIAN_SSH_PASSWORD: ${{ secrets.QINGLIAN_SSH_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json,sys
          sys.path.insert(0,'qinglian/server/github')
          from ssh_common import connection,remote_json
          remote=r"""
import json,os,stat,ssl,socket,sqlite3,subprocess,shutil,re
from pathlib import Path
r={}
def command(args,timeout=8):
 try:
  return subprocess.run(args,capture_output=True,text=True,timeout=timeout)
 except Exception:return None
def filecheck(path):
 if not path or not isinstance(path,str):return 'not_configured'
 p=Path(path)
 try:
  if not p.is_absolute():return 'non_absolute'
  if not p.exists():return 'missing'
  if not p.is_file():return 'not_file'
  return 'ok'
 except Exception:return 'os_error'
cfgPath=Path('/etc/x-ui/qinglian.json')
r['configFile']=filecheck(str(cfgPath))
r['configModeSafe']=bool(cfgPath.exists() and stat.S_IMODE(cfgPath.stat().st_mode)&0o077==0)
cfg={}
try:cfg=json.loads(cfgPath.read_text())
except Exception as e:r['configParseError']=type(e).__name__
r['configShapeValid']=bool(isinstance(cfg,dict) and len(str(cfg.get('clientToken','')))>=32 and cfg.get('ownerId',0)>0 and re.fullmatch('[0-9a-fA-F-]{36}',str(cfg.get('nodeUuid',''))))
tls=cfg.get('tls',{}) if isinstance(cfg.get('tls',{}),dict) else {}
r['configuredPorts']={'api':tls.get('port'),'https':tls.get('httpsPort')}
r['domainConfigured']=tls.get('domainName')=='gaozy.tech'
r['certFiles']={name:filecheck(tls.get(key)) for name,key in [('apiCert','certificate'),('apiKey','privateKey'),('domainCert','domainCertificate'),('domainKey','domainPrivateKey')]}
for kind,cert,key in [('api','certificate','privateKey'),('domain','domainCertificate','domainPrivateKey')]:
 try:
  s=ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER);s.load_cert_chain(tls[cert],tls[key]);r[kind+'TLSKeyPair']='valid'
 except Exception as e:r[kind+'TLSKeyPair']=type(e).__name__
if r['domainConfigured'] and r['certFiles']['domainCert']=='ok':
 p=command(['openssl','x509','-in',tls['domainCertificate'],'-noout','-checkhost','gaozy.tech','-checkend','0'])
 r['domainCertHostnameAndValidity']='valid' if p and p.returncode==0 else 'invalid'
state=cfg.get('statePath') or '/etc/x-ui/qinglian/devices.sqlite3'
r['stateDBFile']=filecheck(state)
if Path(state).is_file():
 try:
  db=sqlite3.connect('file:'+state+'?mode=ro',uri=True,timeout=3)
  r['stateDBQuickCheck']=db.execute('PRAGMA quick_check').fetchone()[0][:40]
  r['stateTablesPresent']=all(db.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name=?",(name,)).fetchone() for name in ['devices','preferences','updates'])
  db.close()
 except Exception as e:r['stateDBError']=type(e).__name__
try:
 st=shutil.disk_usage('/')
 sv=os.statvfs('/')
 r['rootAvailableBytes']=st.free;r['rootAvailableInodes']=sv.f_favail
except Exception as e:r['diskStatError']=type(e).__name__
for port in [11451,11452,443]:
 try:
  with socket.socket() as sock:
   sock.settimeout(2)
   r['localTCP'+str(port)]='accepting' if sock.connect_ex(('127.0.0.1',port))==0 else 'not_accepting'
 except Exception as e:r['localTCP'+str(port)]=type(e).__name__
s=command(['systemctl','show','x-ui','-p','ActiveState','-p','SubState','-p','ActiveEnterTimestamp','-p','ExecMainStartTimestamp','-p','NRestarts'])
if s and s.returncode==0:
 r['systemdState']={p.partition('=')[0]:p.partition('=')[2] for p in s.stdout.splitlines()}
s=command(['journalctl','-u','x-ui','-n','500','--no-pager','-o','cat'])
if s and s.returncode==0:
 logs=s.stdout.lower()
 terms={'tlsUnavailable':'qinglian tls api unavailable','noSpace':'no space left on device','dbLocked':'database is locked','dbMalformed':'database disk image is malformed','openFile':'too many open files','certificate':'failed to load certificate','permission':'permission denied','bindInUse':'address already in use','servicePanic':'panic:','sqliteError':'sqlite3'}
 r['recentLogCategoryCounts']={k:logs.count(v) for k,v in terms.items()}
print(json.dumps(r,ensure_ascii=False))
"""
          with connection() as c:
            result=remote_json(c,remote,timeout=45)
          print(json.dumps(result,ensure_ascii=False,indent=2))
          print('READ_ONLY_DIAGNOSTIC_FINISHED')
          PY
