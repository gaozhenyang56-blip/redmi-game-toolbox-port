name: Qinglian Ubuntu GUI and TUN verification
on:
  push:
    branches: [codex/qinglian-routing-and-presence]
    paths: ['qinglian/ubuntu/**', '.github/workflows/qinglian-ubuntu.yml']
  workflow_dispatch:
    inputs:
      live:
        description: Also verify real guest connections (3 MiB, no deployment)
        type: boolean
        default: false
      release:
        description: Publish the verified Ubuntu package to its dedicated prerelease
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: qinglian
      - name: Install build and native GUI dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openjdk-17-jdk-headless python3-gi python3-gi-cairo python3-cairo python3-pil gir1.2-gtk-3.0 xvfb dbus-x11
      - name: Build isolated fixture package (no live credentials)
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          cp qinglian/app/src/test/resources/tls-ca.pem "$RUNNER_TEMP/assets/ca.pem"
          printf '%s' '{"url":"https://203.0.113.1/api/v1/profile","clientToken":"public-ci-fixture-not-a-real-token","caAsset":"ca.pem"}' > "$RUNNER_TEMP/assets/profile.json"
          python3 qinglian/ubuntu/build.py --assets "$RUNNER_TEMP/assets" --output "$RUNNER_TEMP/qinglian-fixture-test.deb"
          sudo apt-get install -y "$RUNNER_TEMP/qinglian-fixture-test.deb"
      - name: Runtime behavior and packaged native TLS protocols
        env:
          QINGLIAN_TEST_LIB: /usr/lib/qinglian
        run: |
          /usr/bin/python3 -m unittest discover -s qinglian/ubuntu -p test_runtime.py -v
          /usr/bin/python3 -m unittest discover -s qinglian/ubuntu -p test_native.py -v
      - name: Actual GTK pages, themes and launcher
        env:
          QINGLIAN_TEST_LIB: /usr/lib/qinglian
          QINGLIAN_SCREENSHOT: /tmp/qinglian-ubuntu.png
        run: |
          xvfb-run -a dbus-run-session -- /usr/bin/python3 qinglian/ubuntu/test_gui.py
          timeout 5s xvfb-run -a dbus-run-session -- qinglian || test "$?" = 124
      - name: Real TUN in isolated namespace, never runner routing
        run: sudo unshare --net /usr/bin/python3 qinglian/ubuntu/test_tun_namespace.py
      - name: Real panel and guest connections (explicit only)
        if: github.event_name == 'workflow_dispatch' && inputs.live
        env:
          QINGLIAN_SSH_HOST: ${{ secrets.QINGLIAN_SSH_HOST }}
          QINGLIAN_SSH_PORT: ${{ secrets.QINGLIAN_SSH_PORT }}
          QINGLIAN_SSH_USER: ${{ secrets.QINGLIAN_SSH_USER }}
          QINGLIAN_SSH_PASSWORD: ${{ secrets.QINGLIAN_SSH_PASSWORD }}
        run: |
          python3 -m pip install --disable-pip-version-check paramiko==3.5.1
          python3 qinglian/ubuntu/live_smoke.py
      - name: Verify desktop files and package removal
        run: |
          dpkg-deb --info "$RUNNER_TEMP/qinglian-fixture-test.deb"
          test -x /usr/lib/qinglian/qinglian-tun
          test -x /usr/lib/qinglian/tun2socks
          sudo apt-get remove -y qinglian
          test ! -f /usr/bin/qinglian
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qinglian-ubuntu-gui-preview
          path: /tmp/qinglian-ubuntu.png
          if-no-files-found: warn
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: qinglian
      - run: python3 -m pip install --disable-pip-version-check paramiko==3.5.1
      - name: Restore only the deployed app bootstrap and public CA
        env:
          QINGLIAN_SSH_HOST: ${{ secrets.QINGLIAN_SSH_HOST }}
          QINGLIAN_SSH_PORT: ${{ secrets.QINGLIAN_SSH_PORT }}
          QINGLIAN_SSH_USER: ${{ secrets.QINGLIAN_SSH_USER }}
          QINGLIAN_SSH_PASSWORD: ${{ secrets.QINGLIAN_SSH_PASSWORD }}
        run: python3 qinglian/ubuntu/prepare_release_assets.py "$RUNNER_TEMP/app-assets"
      - name: Build production desktop package
        run: |
          mkdir -p "$RUNNER_TEMP/delivery"
          python3 qinglian/ubuntu/build.py --assets "$RUNNER_TEMP/app-assets" --output "$RUNNER_TEMP/delivery/Qinglian-1.0.0-preview3-amd64.deb"
          cp qinglian/ubuntu/README.md "$RUNNER_TEMP/delivery/Qinglian-Ubuntu-Guide.md"
          cd "$RUNNER_TEMP/delivery"
          sha256sum Qinglian-1.0.0-preview3-amd64.deb Qinglian-Ubuntu-Guide.md > Qinglian-Ubuntu-SHA256SUMS.txt
      - name: Publish dedicated Ubuntu prerelease using the repository identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create qinglian-ubuntu-v1.0.0-preview3 -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title '轻连 Ubuntu 1.0.0-preview3' --notes-file qinglian/ubuntu/RELEASE_NOTES.md "$RUNNER_TEMP/delivery/Qinglian-1.0.0-preview3-amd64.deb" "$RUNNER_TEMP/delivery/Qinglian-Ubuntu-SHA256SUMS.txt" "$RUNNER_TEMP/delivery/Qinglian-Ubuntu-Guide.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qinglian-ubuntu-production-package
          path: ${{ runner.temp }}/delivery/
          if-no-files-found: error
