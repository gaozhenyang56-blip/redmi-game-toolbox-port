name: Qinglian published APK verification
on:
  push:
    branches: [codex/qinglian-routing-and-presence]
    paths: ['.github/workflows/qinglian-update-check.yml','qinglian/server/update_release_probe.py']
  workflow_dispatch:
    inputs:
      release:
        description: Publish the verified original-signed Android v22 APK
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: qinglian/server
      - run: python3 -m pip install --disable-pip-version-check paramiko==3.5.1
      - name: Verify private-CA download and original signed APK
        env:
          QINGLIAN_EXPECTED_VERSION: ${{ inputs.release && '22' || '' }}
          QINGLIAN_DELIVERY_DIR: ${{ inputs.release && format('{0}/delivery', runner.temp) || '' }}
          QINGLIAN_SSH_HOST: ${{ secrets.QINGLIAN_SSH_HOST }}
          QINGLIAN_SSH_PORT: ${{ secrets.QINGLIAN_SSH_PORT }}
          QINGLIAN_SSH_USER: ${{ secrets.QINGLIAN_SSH_USER }}
          QINGLIAN_SSH_PASSWORD: ${{ secrets.QINGLIAN_SSH_PASSWORD }}
        run: python3 qinglian/server/update_release_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'workflow_dispatch' && inputs.release
        with:
          name: qinglian-android-v22-verified
          path: ${{ runner.temp }}/delivery/
          if-no-files-found: error
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qinglian-android-v22-verified
          path: delivery
      - name: Publish the verified Android package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd delivery
          sha256sum -c SHA256SUMS.txt
          gh release create qinglian-android-v1.1.13-preview-v22 -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title '轻连 Android 1.1.13-preview · v22' --notes 'WSS首次建连容错：代理CONNECT、TLS与读取等待覆盖冷启动，单次15秒有界；仅首次1字节验证允许一次可恢复错误重试，沿用原核心/节点/账号或访客会话，不重置额度，不重复512KiB通道对照。正常运行检查仍用短等待，取消、严格TLS、响应标记/长度校验保留。Verify增加EOF、SOCKET、TLS及代理状态细分，HY2跨日志分段提取固定原因，不输出原文。原签名和全部CDN API资产核验通过；HY2仍为UDP，不保证运营商线路恢复。' Qinglian-1.1.13-preview-v22.apk SHA256SUMS.txt
