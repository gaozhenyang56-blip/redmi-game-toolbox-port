name: Qinglian published APK verification
on:
  push:
    branches: [codex/qinglian-routing-and-presence]
    paths: ['.github/workflows/qinglian-update-check.yml','qinglian/server/update_release_probe.py']
  workflow_dispatch:
    inputs:
      release:
        description: Publish the verified original-signed Android v18 APK
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: qinglian/server
      - run: python3 -m pip install --disable-pip-version-check paramiko==3.5.1
      - name: Verify private-CA download and original signed APK
        env:
          QINGLIAN_EXPECTED_VERSION: ${{ inputs.release && '18' || '' }}
          QINGLIAN_DELIVERY_DIR: ${{ inputs.release && format('{0}/delivery', runner.temp) || '' }}
          QINGLIAN_SSH_HOST: ${{ secrets.QINGLIAN_SSH_HOST }}
          QINGLIAN_SSH_PORT: ${{ secrets.QINGLIAN_SSH_PORT }}
          QINGLIAN_SSH_USER: ${{ secrets.QINGLIAN_SSH_USER }}
          QINGLIAN_SSH_PASSWORD: ${{ secrets.QINGLIAN_SSH_PASSWORD }}
        run: python3 qinglian/server/update_release_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'workflow_dispatch' && inputs.release
        with:
          name: qinglian-android-v18-verified
          path: ${{ runner.temp }}/delivery/
          if-no-files-found: error
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qinglian-android-v18-verified
          path: delivery
      - name: Publish the verified Android package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd delivery
          sha256sum -c SHA256SUMS.txt
          gh release create qinglian-android-v1.1.9-preview-v18 -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title '轻连 Android 1.1.9-preview · v18' --notes '移动网络面板连接修复：API优先标准HTTPS443，网络建立失败时自动尝试原11452入口，并记住可用端口。原CA和主机名校验、禁止重定向、原签名及配额保留。注册和导出等POST仅在确认尚未发送时切换端口，发送后中断不自动重发。105项Android测试及lint通过；公网验证不代表中国移动实机已恢复，VPN通道本身仍需线路可达。' Qinglian-1.1.9-preview-v18.apk SHA256SUMS.txt
