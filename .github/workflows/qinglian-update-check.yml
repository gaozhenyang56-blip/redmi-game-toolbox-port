name: Qinglian published APK verification
on:
  push:
    branches: [codex/qinglian-routing-and-presence]
    paths: ['.github/workflows/qinglian-update-check.yml','qinglian/server/update_release_probe.py']
  workflow_dispatch:
    inputs:
      release:
        description: Publish the verified original-signed Android v21 APK
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: qinglian/server
      - run: python3 -m pip install --disable-pip-version-check paramiko==3.5.1
      - name: Verify private-CA download and original signed APK
        env:
          QINGLIAN_EXPECTED_VERSION: ${{ inputs.release && '21' || '' }}
          QINGLIAN_DELIVERY_DIR: ${{ inputs.release && format('{0}/delivery', runner.temp) || '' }}
          QINGLIAN_SSH_HOST: ${{ secrets.QINGLIAN_SSH_HOST }}
          QINGLIAN_SSH_PORT: ${{ secrets.QINGLIAN_SSH_PORT }}
          QINGLIAN_SSH_USER: ${{ secrets.QINGLIAN_SSH_USER }}
          QINGLIAN_SSH_PASSWORD: ${{ secrets.QINGLIAN_SSH_PASSWORD }}
        run: python3 qinglian/server/update_release_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'workflow_dispatch' && inputs.release
        with:
          name: qinglian-android-v21-verified
          path: ${{ runner.temp }}/delivery/
          if-no-files-found: error
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qinglian-android-v21-verified
          path: delivery
      - name: Publish the verified Android package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd delivery
          sha256sum -c SHA256SUMS.txt
          gh release create qinglian-android-v1.1.12-preview-v21 -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title '轻连 Android 1.1.12-preview · v21' --notes 'HY2首连容错与错误诊断：首次验证读取等待由3秒改为12秒，总验证15秒有界，支持主动取消；兼容与运行中检查仍用原等待。连接失败按配置、核心、握手、认证、证书和系统VPN阶段显示安全错误码，原生日志只提取固定类别，不保存或上传原文。111项测试及lint通过，原签名、全部CDN API资产、HY2参数及配额不变。此更新改善慢握手容错，不能保证解除运营商UDP限制，尚未获用户移动网络验收。' Qinglian-1.1.12-preview-v21.apk SHA256SUMS.txt
