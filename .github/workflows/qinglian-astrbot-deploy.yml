name: Qinglian AstrBot deployment
on:
  push:
    branches: [codex/qinglian-routing-and-presence]
    paths: ['.github/workflows/qinglian-astrbot-deploy.yml', 'qinglian/astrbot/install.sh', 'qinglian/astrbot/deploy.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qinglian-server-maintenance
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            qinglian/astrbot
            qinglian/server/github
      - name: Validate deployment files
        run: |
          bash -n qinglian/astrbot/install.sh
          python3 -m py_compile qinglian/astrbot/deploy.py
      - name: Fetch official AstrBot release
        run: |
          curl --fail --location --retry 3 https://api.github.com/repos/AstrBotDevs/AstrBot/tarball/dffe922773725e9c178392c423676ad65044748c -o "$RUNNER_TEMP/astrbot-source.tar.gz"
          echo "60bde1415414cb239737a3367cb03d5d06e414ac72524721f374739f06e0eb5a  $RUNNER_TEMP/astrbot-source.tar.gz" | sha256sum -c -
          python3 -m pip install --disable-pip-version-check paramiko==3.5.1
      - name: Deploy and verify AstrBot
        env:
          QINGLIAN_SSH_HOST: ${{ secrets.QINGLIAN_SSH_HOST }}
          QINGLIAN_SSH_PORT: ${{ secrets.QINGLIAN_SSH_PORT }}
          QINGLIAN_SSH_USER: ${{ secrets.QINGLIAN_SSH_USER }}
          QINGLIAN_SSH_PASSWORD: ${{ secrets.QINGLIAN_SSH_PASSWORD }}
        run: python3 qinglian/astrbot/deploy.py
