name: Deploy DSH control UI and reliability protection
on:
  push:
    branches: [codex/dsh-deploy-20261115]
    paths: ['.github/workflows/qinglian-dsh-control.yml', 'qinglian/dsh-control/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qinglian-server-maintenance
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            qinglian/dsh-control
            qinglian/server/github
      - run: python3 -m pip install --disable-pip-version-check paramiko==3.5.1 cryptography==44.0.3
      - run: python3 -m unittest discover -s qinglian/dsh-control -p 'test_*.py' -v
      - name: Deploy loopback management and recover DSH
        env:
          QINGLIAN_SSH_HOST: ${{ secrets.QINGLIAN_SSH_HOST }}
          QINGLIAN_SSH_PORT: ${{ secrets.QINGLIAN_SSH_PORT }}
          QINGLIAN_SSH_USER: ${{ secrets.QINGLIAN_SSH_USER }}
          QINGLIAN_SSH_PASSWORD: ${{ secrets.QINGLIAN_SSH_PASSWORD }}
        run: python3 qinglian/dsh-control/run.py
