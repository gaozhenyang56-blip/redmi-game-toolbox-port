name: Qinglian domain HTTPS and CDN origin
on:
  push:
    branches: [codex/qinglian-routing-and-presence]
    paths: ['.github/workflows/qinglian-domain-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qinglian-server-maintenance
  cancel-in-progress: false
jobs:
  domain:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: qinglian/server
      - name: Check scoped Cloudflare token is configured
        env:
          QINGLIAN_CLOUDFLARE_TOKEN: ${{ secrets.QINGLIAN_CLOUDFLARE_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,re
          if not re.fullmatch(r'[A-Za-z0-9_-]{20,1024}',os.environ.get('QINGLIAN_CLOUDFLARE_TOKEN','')):
              raise SystemExit('Configure QINGLIAN_CLOUDFLARE_TOKEN for gaozy.tech; no server changes made.')
          print('Scoped deployment credential configured; value suppressed.')
          PY
      - run: python3 -m pip install --disable-pip-version-check paramiko==3.5.1
      - name: Encrypted original server backup
        env:
          QINGLIAN_SSH_HOST: ${{ secrets.QINGLIAN_SSH_HOST }}
          QINGLIAN_SSH_PORT: ${{ secrets.QINGLIAN_SSH_PORT }}
          QINGLIAN_SSH_USER: ${{ secrets.QINGLIAN_SSH_USER }}
          QINGLIAN_SSH_PASSWORD: ${{ secrets.QINGLIAN_SSH_PASSWORD }}
        run: python3 qinglian/server/github/backup_server.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qinglian-before-domain-backup
          path: private-transfer/
          retention-days: 14
          if-no-files-found: error
      - name: Install pinned Go
        run: |
          curl -fsSL https://go.dev/dl/go1.23.12.linux-amd64.tar.gz -o "$RUNNER_TEMP/go.tar.gz"
          printf '%s  %s\n' "$(cat qinglian/server/github/go-sdk.sha256)" "$RUNNER_TEMP/go.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/go.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
      - name: Verify and build domain-aware x-ui
        run: |
          git clone --branch 0.3.2 --depth 1 https://github.com/vaxilu/x-ui.git "$RUNNER_TEMP/x-ui"
          python3 qinglian/server/xui032/apply.py "$RUNNER_TEMP/x-ui"
          cd "$RUNNER_TEMP/x-ui"
          go test -race ./web/controller ./web
          go build -trimpath -o "$RUNNER_TEMP/qinglian-x-ui" .
      - name: Issue public certificate, preserve IP API, and verify Cloudflare strict HTTPS
        env:
          QINGLIAN_SSH_HOST: ${{ secrets.QINGLIAN_SSH_HOST }}
          QINGLIAN_SSH_PORT: ${{ secrets.QINGLIAN_SSH_PORT }}
          QINGLIAN_SSH_USER: ${{ secrets.QINGLIAN_SSH_USER }}
          QINGLIAN_SSH_PASSWORD: ${{ secrets.QINGLIAN_SSH_PASSWORD }}
          QINGLIAN_CLOUDFLARE_TOKEN: ${{ secrets.QINGLIAN_CLOUDFLARE_TOKEN }}
          QINGLIAN_SERVER_BINARY: ${{ runner.temp }}/qinglian-x-ui
        run: python3 qinglian/server/github/domain_deploy.py
