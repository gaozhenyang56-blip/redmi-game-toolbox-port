name: Diagnose shipped Windows browser TUN and system proxy
on:
  push:
    branches: [codex/qinglian-routing-and-presence]
    paths: ['.github/workflows/qinglian-windows-browser-check.yml','qinglian/server/github/diagnose_windows_browser.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: qinglian
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Real registry transition and shipped engine startup, no global routes
        env:
          QINGLIAN_CI_WINDOWS: '1'
        run: python qinglian/server/github/diagnose_windows_browser.py
