name: Build Nova Native 3D APK v0.6 PBR Models
on:
  push:
    branches: [nova-native-3d]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download CC0 Cozy Science Lab GLB models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          download_model() {
            local slug="$1"
            local filename="$2"
            local url="https://grab3d.com/dl/${slug}/${filename}"
            local out="app/src/main/assets/models/${filename}"
            if curl --http1.1 -fL --retry 4 --retry-delay 2 --retry-all-errors -A "Mozilla/5.0" --max-time 120 "$url" -o "$out"; then
              if python3 - "$out" <<'PY'
          import sys
          with open(sys.argv[1], "rb") as f:
              ok = f.read(4) == b"glTF"
          raise SystemExit(0 if ok else 1)
          PY
              then
                echo "Downloaded $filename ($(du -h "$out" | cut -f1))"
              else
                echo "::warning::Invalid GLB: $filename"
                rm -f "$out"
              fi
            else
              echo "::warning::Could not download $filename"
              rm -f "$out"
            fi
          }
          download_model beaker beaker.glb
          download_model erlenmeyer-flask erlenmeyer-flask.glb
          download_model graduated-cylinder graduated-cylinder.glb
          download_model lab-funnel lab-funnel.glb
          download_model round-bottom-flask round-bottom-flask.glb
          download_model pipette pipette.glb
          download_model petri-dish petri-dish.glb
          download_model retort-stand retort-stand.glb
          download_model lab-bench lab-bench.glb
          download_model pendulum pendulum.glb
          download_model safety-goggles safety-goggles.glb
          download_model glass-prism glass-prism.glb
          python3 - <<'PY'
          from pathlib import Path
          root = Path("app/src/main/assets/models")
          files = sorted(p.name for p in root.glob("*.glb"))
          if len(files) < 6:
              raise SystemExit(f"Only {len(files)} valid GLB models downloaded; refusing to build an empty library")
          text = """NOVA LAB — MODEL SOURCES
          All included models are from Grab3D's Cozy Science Lab Kit.
          The kit and individual GLB assets are released under CC0 1.0.
          Kit page: https://grab3d.com/kits/cozy-science-lab/
          Model source pages:
          https://grab3d.com/models/props/beaker/
          https://grab3d.com/models/props/erlenmeyer-flask/
          https://grab3d.com/models/props/graduated-cylinder/
          https://grab3d.com/models/props/lab-funnel/
          https://grab3d.com/models/props/round-bottom-flask/
          https://grab3d.com/models/props/pipette/
          https://grab3d.com/models/props/petri-dish/
          https://grab3d.com/models/props/retort-stand/
          https://grab3d.com/models/furniture/lab-bench/
          https://grab3d.com/models/props/pendulum/
          https://grab3d.com/models/props/safety-goggles/
          https://grab3d.com/models/props/glass-prism/
          """
          (root / "MODEL_SOURCES_CC0.txt").write_text(text, encoding="utf-8")
          print(f"Prepared {len(files)} GLB assets: {', '.join(files)}")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build native Filament PBR APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK and bundled model assets
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep 'assets/models/.*\.glb'
          echo "APK size: $(du -h "$APK" | cut -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: NovaLab-v0.6-PBR-GLB-APK
          path: app/build/outputs/apk/debug/app-debug.apk
